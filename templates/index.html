<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<title>Проверка контрагента</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:640px;margin:4em auto;padding:0 1em;color:#1a1a1a}
h1{font-size:1.4em;margin:0 0 1em}
input[type=text]{width:100%;padding:.7em;font-size:1em;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;margin-top:.3em}
select{width:100%;padding:.5em;font-size:1em;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;margin-top:.3em}
button{margin-top:1em;padding:.8em 1.5em;font-size:1em;border:none;border-radius:6px;background:#1976d2;color:#fff;cursor:pointer}
button:disabled{background:#999;cursor:wait}
label{display:block;margin-top:1em;font-size:.9em;color:#555}
.note{margin-top:2em;font-size:.85em;color:#666}
</style></head><body>
<h1>Проверка контрагента</h1>
<form id="f">
  <label>ИНН или ОГРН/ОГРНИП
    <input type="text" id="ident" placeholder="например, 2308026372" required autofocus>
  </label>
  <label>Тип проверки
    <select id="check_type">
      <option value="express">Экспресс-проверка (п. 2.2)</option>
      <option value="full">Полная проверка (п. 2.3)</option>
      <option value="monitoring">Мониторинг действующего контрагента (п. 2.4)</option>
    </select>
  </label>
  <label>Ориентировочная сумма сделки, ₽
    <input type="text" id="amount" placeholder="например, 1500000">
  </label>
  <label><input type="checkbox" id="skip_llm"> Без GigaChat (только детерминированный отчёт)</label>
  <button type="submit" id="btn">Проверить</button>
</form>
<p class="note">Данные: Checko.ru API v2 + DataNewton (СРО) · Анализ: GigaChat · Обычно 5–20 секунд</p>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Проверяю…';
  const fd = new FormData();
  fd.append('ident', document.getElementById('ident').value);
  fd.append('check_type', document.getElementById('check_type').value);
  fd.append('amount', document.getElementById('amount').value || '0');
  fd.append('skip_llm', document.getElementById('skip_llm').checked ? 'true' : 'false');
  try {
    const r = await fetch('/check', {method: 'POST', body: fd});
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    window.location.href = j.url;
  } catch (err) {
    alert('Ошибка: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Проверить';
  }
});
</script>
</body></html>
